name: Bootstrap source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct prepared source files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .bootstrap/READY ]; then
            echo "Bootstrap is not complete yet; waiting for READY marker."
            exit 0
          fi

          cat .bootstrap/main.cpp.b64.* | base64 -d > main.cpp
          cat .bootstrap/NvidiaMemoryWatchdog.ico.b64.* | base64 -d > NvidiaMemoryWatchdog.ico
          cat .bootstrap/icon_preview.png.b64.* | base64 -d > icon_preview.png

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Publish NVIDIA Memory Watchdog source"
          git push
