name: Bootstrap source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand prepared source package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/nvmw.zip ]; then
            echo "Bootstrap archive not present; nothing to do."
            exit 0
          fi

          rm -rf .bootstrap/extracted
          mkdir -p .bootstrap/extracted
          unzip -q .bootstrap/nvmw.zip -d .bootstrap/extracted

          cp -a .bootstrap/extracted/nvmw/. .

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Publish NVIDIA Memory Watchdog source"
          git push
